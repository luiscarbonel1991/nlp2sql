name: Publish Python Package to Test PyPI

# Runs automatically on the release tag when a GitHub Release is published, and
# can be re-run manually from a tag (Use workflow from -> Tags -> vX.Y.Z). A run
# from a branch fails before anything is checked out. See "Releasing
# (maintainers)" in CONTRIBUTING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Require a tag ref
      run: |
        if [ "$GITHUB_REF_TYPE" != "tag" ]; then
          echo "::error title=Not a tag::Run this workflow from a release tag (Use workflow from -> Tags), not from '$GITHUB_REF_NAME'."
          exit 1
        fi

    - name: Checkout the tag
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Verify the tag matches the package version
      run: |
        echo "Tag: $GITHUB_REF_NAME, commit: $GITHUB_SHA"
        python .github/scripts/verify_release_tag.py "$GITHUB_REF_NAME"

    - name: Install uv
      run: python -m pip install uv

    - name: Install project dependencies with uv
      run: |
        uv pip install --system .
        uv pip install --system ".[dev]"

    - name: Install build
      run: python -m pip install build

    - name: Run tests
      env:
        PYTHONPATH: src
      run: pytest

    - name: Build package
      run: python -m build

    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi

    # Only this job can request a Test PyPI token (Trusted Publishing via OIDC),
    # and it runs no project or third-party Python code.
    permissions:
      id-token: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
