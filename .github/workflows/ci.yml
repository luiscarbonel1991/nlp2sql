name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      run: python -m pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system .
        uv pip install --system ".[dev]"

    - name: Unit tests
      env:
        PYTHONPATH: src
      run: pytest -m "not integration and not llm" -q

  pgvector-integration:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      run: python -m pip install uv

    - name: Install dependencies (with pgvector extra)
      run: |
        uv pip install --system ".[dev]"
        uv pip install --system ".[pgvector]"

    - name: Load the e-commerce test schema
      env:
        PGPASSWORD: testpass
      run: psql -h localhost -U testuser -d testdb -v ON_ERROR_STOP=1 -q -f docker/init-schema.sql

    # Scoped suites so the job stays self-contained (the broader integration
    # suite also needs LocalStack Redshift, out of scope here).
    # NLP2SQL_REQUIRE_INTEGRATION makes the fixtures FAIL instead of skip, so a
    # misconfigured service goes red rather than green-via-skip.
    - name: pgvector integration tests
      env:
        PYTHONPATH: src
        NLP2SQL_REQUIRE_INTEGRATION: "1"
        NLP2SQL_TEST_POSTGRES_HOST: localhost
        NLP2SQL_TEST_POSTGRES_PORT: "5432"
        NLP2SQL_TEST_POSTGRES_USER: testuser
        NLP2SQL_TEST_POSTGRES_PASS: testpass
        NLP2SQL_TEST_POSTGRES_DB: testdb
      run: pytest tests/test_pgvector_example_repository.py -m integration -q

    # README Quick Start per provider and the false-invalid gold set, with the
    # OpenAI SDK pointed at tests/fakes/fake_openai.py (no keys, no cost).
    - name: First-run regression tests
      env:
        PYTHONPATH: src
        NLP2SQL_REQUIRE_INTEGRATION: "1"
        NLP2SQL_TEST_POSTGRES_HOST: localhost
        NLP2SQL_TEST_POSTGRES_PORT: "5432"
        NLP2SQL_TEST_POSTGRES_USER: testuser
        NLP2SQL_TEST_POSTGRES_PASS: testpass
        NLP2SQL_TEST_POSTGRES_DB: testdb
      run: pytest tests/test_first_run.py tests/test_false_invalid_regression.py -m integration -q

  # Installs the built wheel the way a user does: fresh environment, no lock
  # file, latest dependency versions. Catches undeclared dependencies (rc13-rc15
  # could not be imported without pyyaml) that the locked dev environment hides.
  clean-install:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Build the wheel
      run: |
        python -m pip install build
        python -m build --wheel

    - name: Install the wheel in a fresh environment
      run: |
        python -m venv "$RUNNER_TEMP/clean"
        "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/clean/bin/pip" list | grep -iE "^(openai|anthropic|google-generativeai|pyyaml) "

    - name: Import the package and run the CLI
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/clean/bin/python" -c "import nlp2sql; print('nlp2sql', nlp2sql.__version__)"
        "$RUNNER_TEMP/clean/bin/nlp2sql" --help
