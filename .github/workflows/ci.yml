name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: python -m pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system .
        uv pip install --system ".[dev]"

    - name: Unit tests
      env:
        PYTHONPATH: src
      run: pytest -m "not integration and not llm" -q

  pgvector-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: python -m pip install uv

    - name: Install dependencies (with pgvector extra)
      run: |
        uv pip install --system ".[dev]"
        uv pip install --system ".[pgvector]"

    # Scoped to the pgvector adapter suite so the job is self-contained (the
    # broader integration suite needs init-schema.sql / LocalStack Redshift,
    # which are out of scope for this lane). NLP2SQL_REQUIRE_INTEGRATION makes
    # the fixtures FAIL instead of skip, so a misconfigured service goes red
    # rather than green-via-skip (collection != execution).
    - name: pgvector integration tests
      env:
        PYTHONPATH: src
        NLP2SQL_REQUIRE_INTEGRATION: "1"
        NLP2SQL_TEST_POSTGRES_HOST: localhost
        NLP2SQL_TEST_POSTGRES_PORT: "5432"
        NLP2SQL_TEST_POSTGRES_USER: testuser
        NLP2SQL_TEST_POSTGRES_PASS: testpass
        NLP2SQL_TEST_POSTGRES_DB: testdb
      run: pytest tests/test_pgvector_example_repository.py -m integration -q
