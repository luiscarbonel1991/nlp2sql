services:
  postgres:
    image: pgvector/pgvector:pg${POSTGRES_VERSION:-16}
    container_name: ${SIMPLE_CONTAINER_NAME:-nlp2sql-postgres}
    environment:
      POSTGRES_USER: ${SIMPLE_DB_USER:-testuser}
      POSTGRES_PASSWORD: ${SIMPLE_DB_PASSWORD:-testpass}
      POSTGRES_DB: ${SIMPLE_DB_NAME:-testdb}
    ports:
      - "${SIMPLE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIMPLE_DB_USER:-testuser} -d ${SIMPLE_DB_NAME:-testdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-large:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: ${LARGE_CONTAINER_NAME:-nlp2sql-postgres-large}
    environment:
      POSTGRES_USER: ${LARGE_DB_USER:-demo}
      POSTGRES_PASSWORD: ${LARGE_DB_PASSWORD:-demo123}
      POSTGRES_DB: ${LARGE_DB_NAME:-enterprise}
    ports:
      - "${LARGE_DB_PORT:-5433}:5432"
    volumes:
      - postgres_large_data:/var/lib/postgresql/data
      - ./large-schema.sql:/docker-entrypoint-initdb.d/large-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LARGE_DB_USER:-demo} -d ${LARGE_DB_NAME:-enterprise}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL and MariaDB: the same e-commerce schema as postgres, in mysql/init-schema.sql.
  # No data volume: the schema is loaded again each time the container is created.
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-nlp2sql-mysql}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${MYSQL_DB_USER:-testuser}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:-testpass}
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-testdb}
    ports:
      - "${MYSQL_DB_PORT:-3306}:3306"
    volumes:
      - ./mysql/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_DB_USER:-testuser} -p${MYSQL_DB_PASSWORD:-testpass} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    container_name: ${MARIADB_CONTAINER_NAME:-nlp2sql-mariadb}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_USER: ${MARIADB_DB_USER:-testuser}
      MARIADB_PASSWORD: ${MARIADB_DB_PASSWORD:-testpass}
      MARIADB_DATABASE: ${MARIADB_DB_NAME:-testdb}
    ports:
      - "${MARIADB_DB_PORT:-3307}:3306"
    volumes:
      - ./mysql/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # LocalStack for Redshift testing
  localstack:
    image: localstack/localstack:latest
    container_name: ${LOCALSTACK_CONTAINER_NAME:-nlp2sql-localstack}
    environment:
      - SERVICES=redshift
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - REDSHIFT_PORT=5439
      - DEFAULT_REGION=us-east-1
      # AWS credentials for LocalStack (dummy values work)
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"  # LocalStack main endpoint
      - "${REDSHIFT_PORT:-5439}:5439"  # Redshift port
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init.sh:/etc/localstack/init/ready.d/init-redshift.sh"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  postgres_large_data:
