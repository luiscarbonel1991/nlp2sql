[project]
name = "nlp2sql-mcp"
version = "0.2.0rc22"
description = "MCP server for nlp2sql - Natural Language to SQL conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # server.py uses FastMCP, which mcp 2.x renamed to MCPServer
    "mcp<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mcp]
name = "nlp2sql"
description = "Convert natural language queries to SQL using multiple AI providers"
version = "0.2.0rc22"